name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Romankhanfx01
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F59E0B&color_dots=#ebedf5,#c9d8f0,#8fb5e3,#4F9DEB,#1E3A8A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FBBF24&color_dots=#0b1026,#123a66,#1f5fa8,#4f9deb,#FBBF24

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
