<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="Animated solar system banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060F"/>
      <stop offset="0.5" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#0A0E24"/>
    </linearGradient>
    <linearGradient id="mwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D8BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4F9DEB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunMid" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FBBF24" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#FFF8D6"/>
      <stop offset="0.45" stop-color="#FDE047"/>
      <stop offset="0.8" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="sunHot" cx="45%" cy="42%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pMars" cx="34%" cy="36%" r="75%">
      <stop offset="0" stop-color="#FCA5A5"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </radialGradient>
    <radialGradient id="pEarth" cx="34%" cy="36%" r="75%">
      <stop offset="0" stop-color="#9BD4FF"/>
      <stop offset="0.5" stop-color="#4F9DEB"/>
      <stop offset="1" stop-color="#14345E"/>
    </radialGradient>
    <radialGradient id="pJup" cx="33%" cy="35%" r="78%">
      <stop offset="0" stop-color="#FCD9A0"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="pSat" cx="34%" cy="36%" r="75%">
      <stop offset="0" stop-color="#F3E3B8"/>
      <stop offset="0.5" stop-color="#D9A066"/>
      <stop offset="1" stop-color="#8A5A2B"/>
    </radialGradient>
    <radialGradient id="pNep" cx="34%" cy="36%" r="75%">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </radialGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-78" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9BD4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tail2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-60" y2="0">
      <stop offset="0" stop-color="#E9D5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="heroClip"><rect width="1400" height="360" rx="18"/></clipPath>
    <clipPath id="earthClip"><circle r="13"/></clipPath>
    <clipPath id="jupClip"><circle r="24"/></clipPath>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1400" height="360" fill="url(#bg)"/>

    <!-- milky way band -->
    <g transform="rotate(-12 980 180)">
      <ellipse cx="980" cy="180" rx="560" ry="80" fill="url(#mwGrad)" filter="url(#soft)" opacity="0.9"/>
    </g>

    <!-- nebulas -->
    <circle cx="1180" cy="60" r="70" fill="#8B5CF6" opacity="0.10" filter="url(#soft)"/>
    <circle cx="420" cy="320" r="80" fill="#4F9DEB" opacity="0.10" filter="url(#soft)"/>
    <circle cx="760" cy="30" r="60" fill="#FBBF24" opacity="0.05" filter="url(#soft)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="40" cy="30" r="1.2" opacity="0.9"/>
      <circle cx="90" cy="90" r="1" opacity="0.5"/>
      <circle cx="150" cy="260" r="1.1" opacity="0.7"/>
      <circle cx="215" cy="50" r="1" opacity="0.8"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="200" r="1.3" opacity="0.8" fill="#9BD4FF"/>
      <circle cx="330" cy="320" r="1" opacity="0.5"/>
      <circle cx="400" cy="60" r="1" opacity="0.6"/>
      <circle cx="455" cy="150" r="1" opacity="0.35"/>
      <circle cx="520" cy="240" r="1.2" opacity="0.75"><animate attributeName="opacity" values="0.75;0.1;0.75" dur="4.4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="310" r="1" opacity="0.45"/>
      <circle cx="640" cy="20" r="1.2" opacity="0.75" fill="#FDE68A"/>
      <circle cx="690" cy="120" r="1" opacity="0.3"/>
      <circle cx="745" cy="250" r="1.1" opacity="0.6"/>
      <circle cx="800" cy="180" r="1" opacity="0.4"/>
      <circle cx="860" cy="40" r="1.3" opacity="0.8" fill="#C4B5FD"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="910" cy="120" r="1" opacity="0.35"/>
      <circle cx="960" cy="300" r="1" opacity="0.55"/>
      <circle cx="1010" cy="220" r="1.2" opacity="0.7"/>
      <circle cx="1060" cy="80" r="1" opacity="0.65"><animate attributeName="opacity" values="0.65;0.12;0.65" dur="4.8s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="160" r="1.1" opacity="0.6"/>
      <circle cx="1155" cy="290" r="1" opacity="0.4"/>
      <circle cx="1210" cy="30" r="1.2" opacity="0.75" fill="#9BD4FF"/>
      <circle cx="1250" cy="130" r="1" opacity="0.35"/>
      <circle cx="1300" cy="250" r="1.1" opacity="0.65"/>
      <circle cx="1345" cy="300" r="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="150" r="1.2" opacity="0.6"/>
      <circle cx="60" cy="320" r="1" opacity="0.4"/>
      <circle cx="120" cy="20" r="1" opacity="0.5"/>
      <circle cx="170" cy="120" r="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="5.2s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="290" r="1.1" opacity="0.6"/>
      <circle cx="300" cy="150" r="1" opacity="0.45" fill="#C4B5FD"/>
      <circle cx="360" cy="40" r="1.2" opacity="0.7"/>
      <circle cx="420" cy="260" r="1" opacity="0.55"><animate attributeName="opacity" values="0.55;0.1;0.55" dur="3.9s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="90" r="1" opacity="0.55"/>
      <circle cx="540" cy="330" r="1" opacity="0.4"/>
      <circle cx="600" cy="210" r="1.1" opacity="0.65"/>
      <circle cx="660" cy="60" r="1" opacity="0.35"/>
      <circle cx="720" cy="330" r="1" opacity="0.5"/>
      <circle cx="770" cy="90" r="1" opacity="0.45"><animate attributeName="opacity" values="0.45;0.08;0.45" dur="4.2s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="270" r="1.1" opacity="0.6"/>
      <circle cx="890" cy="190" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="60" r="1.2" opacity="0.7" fill="#FDE68A"/>
      <circle cx="1000" cy="150" r="1" opacity="0.35"/>
      <circle cx="1050" cy="320" r="1" opacity="0.5"/>
      <circle cx="1090" cy="20" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="240" r="1" opacity="0.35"/>
      <circle cx="1200" cy="330" r="1" opacity="0.55"/>
      <circle cx="1240" cy="50" r="1" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="4.6s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1280" cy="170" r="1.1" opacity="0.6"/>
      <circle cx="1330" cy="80" r="1" opacity="0.35"/>
      <circle cx="1370" cy="220" r="1" opacity="0.5"/>
      <circle cx="30" cy="230" r="1" opacity="0.35"/>
      <circle cx="100" cy="180" r="1" opacity="0.5"/>
      <circle cx="140" cy="60" r="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.08;0.5" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="330" r="1" opacity="0.45"/>
      <circle cx="250" cy="30" r="1.1" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="3.8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="230" r="1" opacity="0.35"/>
      <circle cx="370" cy="200" r="1" opacity="0.5"/>
      <circle cx="430" cy="330" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.1s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="490" cy="180" r="1" opacity="0.35"/>
    </g>

    <!-- sparkles -->
    <g fill="#FFFFFF" opacity="0.6">
      <path d="M0 -7 L1.4 -1.4 L7 0 L1.4 1.4 L0 7 L-1.4 1.4 L-7 0 L-1.4 -1.4 Z" transform="translate(880 300) scale(0.9)">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -7 L1.4 -1.4 L7 0 L1.4 1.4 L0 7 L-1.4 1.4 L-7 0 L-1.4 -1.4 Z" transform="translate(320 40) scale(0.7)">
        <animate attributeName="opacity" values="0.5;0.08;0.5" dur="3.7s" begin="1.3s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -7 L1.4 -1.4 L7 0 L1.4 1.4 L0 7 L-1.4 1.4 L-7 0 L-1.4 -1.4 Z" transform="translate(1265 320) scale(0.8)">
        <animate attributeName="opacity" values="0.55;0.1;0.55" dur="5.1s" begin="0.7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- orbits -->
    <ellipse cx="180" cy="180" rx="420" ry="88" fill="none" stroke="#3B6FB5" stroke-width="1.2" opacity="0.28" stroke-dasharray="3 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="180" rx="590" ry="112" fill="none" stroke="#7C93BC" stroke-width="2.4" stroke-dasharray="0.5 20" stroke-linecap="round" opacity="0.30"/>
    <ellipse cx="180" cy="180" rx="760" ry="140" fill="none" stroke="#3B6FB5" stroke-width="1.1" opacity="0.20"/>
    <ellipse cx="180" cy="180" rx="1120" ry="205" fill="none" stroke="#3B6FB5" stroke-width="1" opacity="0.16"/>

    <!-- sun -->
    <g transform="translate(180 180)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.045;1" dur="8s" repeatCount="indefinite"/>
        <circle r="92" fill="url(#sunMid)"/>
        <circle r="54" fill="url(#sunCore)"/>
        <circle r="36" fill="url(#sunHot)"/>
      </g>
      <circle r="150" fill="url(#sunGlow)" opacity="0.5">
        <animate attributeName="opacity" values="0.32;0.6;0.32" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- mars -->
    <g transform="translate(310 96)">
      <circle r="20" fill="#EF4444" opacity="0.16"/>
      <circle r="9" fill="url(#pMars)"/>
    </g>

    <!-- earth + moon -->
    <g transform="translate(536 133)">
      <circle r="30" fill="#4F9DEB" opacity="0.14"/>
      <circle r="13" fill="url(#pEarth)"/>
      <g clip-path="url(#earthClip)">
        <ellipse cx="-3" cy="-4" rx="7" ry="4.4" fill="#34D399" opacity="0.85" transform="rotate(22 -3 -4)"/>
        <ellipse cx="4" cy="5" rx="5.6" ry="3.6" fill="#34D399" opacity="0.7" transform="rotate(-16 4 5)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
        <circle cx="26" cy="0" r="3.2" fill="#C7D2E4" opacity="0.9"/>
      </g>
    </g>

    <!-- jupiter -->
    <g transform="translate(594 63)">
      <circle r="40" fill="#F59E0B" opacity="0.08"/>
      <circle r="24" fill="url(#pJup)"/>
      <g clip-path="url(#jupClip)">
        <rect x="-26" y="-14" width="52" height="5.5" rx="2.5" fill="#B45309" opacity="0.45"/>
        <rect x="-26" y="-2.5" width="52" height="4" rx="2" fill="#B45309" opacity="0.3"/>
        <rect x="-26" y="8" width="52" height="6" rx="2.5" fill="#B45309" opacity="0.38"/>
      </g>
    </g>

    <!-- saturn -->
    <g transform="translate(1187 90)">
      <circle r="36" fill="#E8C48A" opacity="0.12"/>
      <g transform="rotate(-18)">
        <ellipse rx="46" ry="13" fill="none" stroke="#D8C08A" stroke-width="2.6" opacity="0.85"/>
        <ellipse rx="37" ry="9.5" fill="none" stroke="#A98F5C" stroke-width="1.2" opacity="0.6"/>
      </g>
      <circle r="19" fill="url(#pSat)"/>
    </g>

    <!-- neptune -->
    <g transform="translate(1293 201)">
      <circle r="22" fill="#8B5CF6" opacity="0.16"/>
      <circle r="11" fill="url(#pNep)"/>
    </g>

    <!-- comet 1 -->
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" rotate="auto" path="M1380 30 Q 950 90 600 225"/>
      <g>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.88;1" dur="14s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="-78" y2="0" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
        <circle r="6" fill="#9BD4FF" opacity="0.35"/>
        <circle r="2.6" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- comet 2 -->
    <g>
      <animateMotion dur="19s" begin="7s" repeatCount="indefinite" rotate="auto" path="M260 355 Q 860 290 1380 80"/>
      <g>
        <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="19s" begin="7s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="-60" y2="0" stroke="url(#tail2)" stroke-width="1.6" stroke-linecap="round"/>
        <circle r="5" fill="#C4B5FD" opacity="0.3"/>
        <circle r="2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
