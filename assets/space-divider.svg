<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="72" viewBox="0 0 1400 72" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F9DEB" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#4F9DEB" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="0.82" stop-color="#4F9DEB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F9DEB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunDotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="60" y="34.5" width="1280" height="2" rx="1" fill="url(#line)"/>

  <!-- orbit tick around the sun -->
  <ellipse cx="700" cy="35" rx="30" ry="8.5" fill="none" stroke="#4F9DEB" stroke-width="1" opacity="0.35"/>

  <!-- mini planets on the line -->
  <circle cx="300" cy="35" r="3.6" fill="#4F9DEB"/>
  <circle cx="300" cy="35" r="8" fill="#4F9DEB" opacity="0.18"/>
  <circle cx="478" cy="35" r="3" fill="#EF4444"/>
  <circle cx="478" cy="35" r="7" fill="#EF4444" opacity="0.16"/>
  <circle cx="922" cy="35" r="3.4" fill="#8B5CF6"/>
  <circle cx="922" cy="35" r="7.5" fill="#8B5CF6" opacity="0.18"/>
  <circle cx="1102" cy="35" r="3" fill="#2DD4BF"/>
  <circle cx="1102" cy="35" r="7" fill="#2DD4BF" opacity="0.16"/>

  <!-- sun -->
  <circle cx="700" cy="35" r="26" fill="url(#sunDotGlow)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="35" r="8.5" fill="#FBBF24"/>
  <circle cx="700" cy="35" r="4.6" fill="#FFF7CC"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="180" cy="16" r="1" opacity="0.5"/>
    <circle cx="360" cy="55" r="1" opacity="0.4"/>
    <circle cx="540" cy="14" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="58" r="1" opacity="0.35"/>
    <circle cx="760" cy="12" r="1" opacity="0.5"/>
    <circle cx="840" cy="56" r="1.1" opacity="0.55"><animate attributeName="opacity" values="0.55;0.1;0.55" dur="4.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="16" r="1" opacity="0.45"/>
    <circle cx="1180" cy="54" r="1" opacity="0.4"/>
    <circle cx="1260" cy="18" r="1.1" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="56" r="1" opacity="0.3"/>
  </g>
</svg>
