<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Career trajectory — flight path">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060F"/>
      <stop offset="0.5" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#0A0E24"/>
    </linearGradient>
    <radialGradient id="tg1" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="tg2" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#9BD4FF"/>
      <stop offset="0.5" stop-color="#4F9DEB"/>
      <stop offset="1" stop-color="#14345E"/>
    </radialGradient>
    <radialGradient id="tg3" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </radialGradient>
    <radialGradient id="tg4" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#115E59"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#tbg)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="60" r="1" opacity="0.5"/>
    <circle cx="180" cy="210" r="1" opacity="0.35"/>
    <circle cx="260" cy="40" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="230" r="1" opacity="0.4"/>
    <circle cx="430" cy="60" r="1" opacity="0.5"/>
    <circle cx="520" cy="220" r="1.1" opacity="0.55"><animate attributeName="opacity" values="0.55;0.1;0.55" dur="4.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="40" r="1" opacity="0.45"/>
    <circle cx="700" cy="225" r="1" opacity="0.4"/>
    <circle cx="780" cy="55" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="215" r="1" opacity="0.35"/>
    <circle cx="940" cy="50" r="1" opacity="0.5"/>
    <circle cx="970" cy="200" r="1" opacity="0.4"/>
    <circle cx="40" cy="160" r="1" opacity="0.35"/>
    <circle cx="960" cy="120" r="1" opacity="0.3"/>
  </g>

  <!-- headers -->
  <text x="36" y="44" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#4F9DEB" opacity="0.85">FLIGHT PATH</text>
  <text x="964" y="44" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#4F9DEB" opacity="0.45">2026</text>

  <!-- flight path -->
  <path d="M 40 130 L 120 130 Q 250 78 380 130 Q 510 78 640 130 Q 770 78 900 130 L 960 130" fill="none" stroke="#3B6FB5" stroke-width="1.6" stroke-dasharray="6 7" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- node 1 : NOW -->
  <g>
    <circle cx="120" cy="130" r="13" fill="none" stroke="#FBBF24" stroke-width="1.8">
      <animate attributeName="r" values="14;30" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="130" r="26" fill="#FBBF24" opacity="0.15"/>
    <circle cx="120" cy="130" r="13" fill="url(#tg1)"/>
    <text x="120" y="94" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#FBBF24">NOW</text>
    <text x="120" y="165" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9BB4D6">AI apps &amp; agent tools</text>
  </g>

  <!-- node 2 : NEXT -->
  <g>
    <circle cx="380" cy="130" r="26" fill="#4F9DEB" opacity="0.15"/>
    <circle cx="380" cy="130" r="13" fill="url(#tg2)"/>
    <text x="380" y="94" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#4F9DEB">NEXT</text>
    <text x="380" y="165" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9BB4D6">LLM + RAG systems at scale</text>
  </g>

  <!-- node 3 : GOAL -->
  <g>
    <circle cx="640" cy="130" r="26" fill="#8B5CF6" opacity="0.15"/>
    <circle cx="640" cy="130" r="13" fill="url(#tg3)"/>
    <text x="640" y="94" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#8B5CF6">GOAL</text>
    <text x="640" y="165" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9BB4D6">Products that scale</text>
  </g>

  <!-- node 4 : BEYOND -->
  <g>
    <circle cx="900" cy="130" r="26" fill="#2DD4BF" opacity="0.15"/>
    <circle cx="900" cy="130" r="13" fill="url(#tg4)"/>
    <text x="900" y="94" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#2DD4BF">BEYOND</text>
    <text x="900" y="165" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9BB4D6">Open source &amp; sharing</text>
  </g>
</svg>
